# contracts/bz_orders.yaml  (draft generated by profile_source.py; edited by Deniz)
table: bz_orders_2027
owner: bazaarly-app@meridian.example.com
grain: "One row per order"
delivery:
  method: daily_csv            # daily incremental file since January 2027
  ready_by: "05:00 UTC"
  # the hourly status file required by the Chapter 5 ADR is a separate contract, still under discussion with Bazaarly
primary_key: [order_id]
columns:
  - name: order_id
    type: string
    nullable: false
    unique: true
  - name: user_id
    type: string
    nullable: false
  - name: channel_code
    type: string
    allowed_values: ["10", "20", "30", "40"]
    description: "Sales channel (source guide, p. 4)"
    open_question: "value 50 appears; meaning not documented"
  - name: status_code
    type: string
    nullable: false
  - name: currency
    type: string
    allowed_values: ["USD", "CAD", "GBP", "EUR"]
  - name: order_total
    type: decimal(12,2)
    description: ""            # not in the guide, left empty
    pii: false
quality:
  - "order_total = sum of line totals"
change_policy: "Column renames and removals are announced at least 10 business days in advance"
# --- change log -------------------------------------------------------------------------------
# 2027-04-16  status_code was renamed to status in the daily files from 2027-04-15 (INC-20270416-07,
#             Chapter 13). Agreed with the source owner: "status" is the same field. silver reads
#             COALESCE(status_code, status); the schema gate now expects "status" for new files.
